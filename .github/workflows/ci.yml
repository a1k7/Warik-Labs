name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  api:
    name: API lint, migrations and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: warik
          POSTGRES_USER: warik
          POSTGRES_PASSWORD: warik_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warik -d warik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://warik:warik_dev_only@localhost:5432/warik
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Apply migrations
        run: alembic upgrade head
      - name: Pytest
        run: pytest -q

  console:
    name: Console lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.21.0 --activate
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm --filter @warik/console lint
      - name: Typecheck
        run: pnpm --filter @warik/console typecheck
      - name: Build
        run: pnpm --filter @warik/console build
